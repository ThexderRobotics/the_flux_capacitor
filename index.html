<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Construction</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #f8fafc;
        background: linear-gradient(135deg, #0f172a, #1e293b 55%, #0f766e);
      }

      main {
        width: min(90%, 680px);
        padding: 4rem 2rem;
        text-align: center;
      }

      .icon { font-size: 4rem; margin-bottom: 1.5rem; }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0 auto;
        max-width: 30rem;
        color: #cbd5e1;
        font-size: 1.15rem;
        line-height: 1.7;
      }

      .bar {
        width: min(100%, 360px);
        height: 8px;
        margin: 2rem auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 15%);
      }

      .bar::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #2dd4bf;
        animation: loading 2s ease-in-out infinite;
      }

      @keyframes loading {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(120%); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🛠️</div>
      <h1>Under construction</h1>
      <p>We’re working behind the scenes. Please check back soon for something new.</p>
      <div class="bar" aria-label="Work in progress"></div>
    </main>
  </body>
</html>

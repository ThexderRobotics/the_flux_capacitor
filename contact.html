<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Contact Zander Booyzen." /><title>Zander Booyzen | Contact</title><link rel="stylesheet" href="styles.css" /></head>
  <body><div class="wrap">
    <header><div class="mark">ZB / personal</div><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="cv.html">CV</a><a class="active" href="contact.html">Contact</a><span class="build">BUILD 0031</span></nav></header>
    <main><div class="page-intro"><div class="eyebrow">03 / Contact</div><h1>Let’s start a conversation.</h1><p class="intro">Have a question, an idea, or an opportunity to share? Send me a message and I’ll get back to you.</p></div>
      <div class="content-card"><form class="contact-form" id="contact-form"><div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required /></div><div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" required /></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div><div class="field" aria-hidden="true" style="position:absolute;left:-9999px"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off" /></div><div class="actions"><button class="button" type="submit">Send message →</button></div><p class="form-note" id="form-status" aria-live="polite">Your message will be sent directly to mail@zanderbooyzen.com.</p></form></div>
    </main>
    <footer>© 2026 Zander Booyzen · <a href="index.html">Back home</a></footer>
  </div><script>document.getElementById('contact-form').addEventListener('submit',async function(event){event.preventDefault();const form=event.currentTarget;const status=document.getElementById('form-status');const button=form.querySelector('button');button.disabled=true;button.textContent='Sending…';status.textContent='Sending your message…';try{const response=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.name.value,email:form.email.value,message:form.message.value,website:form.website.value})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Email service could not send the message.');form.reset();status.textContent='Thanks — your message has been sent.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;button.textContent='Send message →';}});</script><script src="site.js"></script></body>
</html>
